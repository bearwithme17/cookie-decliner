<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SP Privacy Manager</title>
<script src="/harness.js"></script>
</head>
<body>
<div class="type-modal privacy-manager">
  <h1>Datenschutz-Einstellungen</h1>
  <p>Hier können Sie Ihre Einwilligung für einzelne Zwecke erteilen oder verweigern.</p>
  <button class="message-component sp_choice_type_ACCEPT_ALL" data-cd="accepted">Alle akzeptieren</button>
  <button class="message-component sp_choice_type_REJECT_ALL" data-cd="rejected">Alle ablehnen</button>
  <button class="message-component sp_choice_type_SAVE_AND_EXIT" data-cd="saved">Speichern &amp; Schließen</button>
</div>
</body>
</html>
