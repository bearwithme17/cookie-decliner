<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cookiebot</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  .fx-banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px; background: #222; color: #fff; z-index: 9999; }
  .fx-modal { position: fixed; left: 20%; top: 20%; width: 60%; padding: 16px; background: #fff; border: 1px solid #000; z-index: 9999; }
  button, a.btn { margin: 4px; padding: 6px 10px; }
</style>
<script src="/harness.js"></script>
</head>
<body>
<h1>Cookiebot</h1>
<p>Fixture page. Lorem ipsum dolor sit amet, consetetur sadipscing elitr.</p>

<div id="CybotCookiebotDialog" class="fx-modal">
  <div id="CybotCookiebotDialogBodyContentText">Diese Webseite verwendet Cookies.</div>
  <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll" data-cd="rejected" data-cd-hide="#CybotCookiebotDialog">Ablehnen</button>
  <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection" data-cd="accepted" data-cd-hide="#CybotCookiebotDialog">Auswahl erlauben</button>
  <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll" data-cd="accepted" data-cd-hide="#CybotCookiebotDialog">Alle zulassen</button>
</div>
<script>
  window.Cookiebot = {
    hasResponse: false, declined: false, dialog: { visible: true },
    withdraw: function () { CDT.report("api-withdraw"); },
    hide: function () { CDT.report("api-hide"); },
    submitCustomConsent: function () { CDT.report("accepted"); }
  };
  document.getElementById("CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll").addEventListener("click", function () {
    window.Cookiebot.declined = true; window.Cookiebot.hasResponse = true; window.Cookiebot.dialog.visible = false;
  });
</script>
</body>
</html>
