<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Usercentrics</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  .fx-banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px; background: #222; color: #fff; z-index: 9999; }
  .fx-modal { position: fixed; left: 20%; top: 20%; width: 60%; padding: 16px; background: #fff; border: 1px solid #000; z-index: 9999; }
  button, a.btn { margin: 4px; padding: 6px 10px; }
</style>
<script src="/harness.js"></script>
</head>
<body>
<h1>Usercentrics</h1>
<p>Fixture page. Lorem ipsum dolor sit amet, consetetur sadipscing elitr.</p>

<div id="usercentrics-root" style="position:fixed;left:0;right:0;bottom:0;z-index:9999"></div>
<script>
  (function () {
    var root = document.getElementById("usercentrics-root").attachShadow({ mode: "open" });
    root.innerHTML =
      "<div data-testid=\"uc-container\" style=\"background:#fff;border:1px solid #000;padding:16px\">" +
      "<p>Wir nutzen Cookies und andere Technologien.</p>" +
      "<button data-testid=\"uc-more-button\" data-cd=\"settings\">Mehr Informationen</button>" +
      "<button data-testid=\"uc-deny-all-button\" data-cd=\"rejected\">Alles ablehnen</button>" +
      "<button data-testid=\"uc-accept-all-button\" data-cd=\"accepted\">Alles akzeptieren</button></div>";
    CDT.wire(root);
    root.querySelector("[data-testid=uc-deny-all-button]").addEventListener("click", function () { root.innerHTML = ""; });
    window.UC_UI = {
      denyAllConsents: function () { CDT.report("api-deny"); return Promise.resolve(); },
      acceptAllConsents: function () { CDT.report("accepted"); return Promise.resolve(); },
      closeCMP: function () { CDT.report("api-close"); return true; },
      areAllConsentsAccepted: function () { return false; }
    };
  })();
</script>
</body>
</html>
