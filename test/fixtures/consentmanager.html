<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>consentmanager</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  .fx-banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px; background: #222; color: #fff; z-index: 9999; }
  .fx-modal { position: fixed; left: 20%; top: 20%; width: 60%; padding: 16px; background: #fff; border: 1px solid #000; z-index: 9999; }
  button, a.btn { margin: 4px; padding: 6px 10px; }
</style>
<script src="/harness.js"></script>
</head>
<body>
<h1>consentmanager</h1>
<p>Fixture page. Lorem ipsum dolor sit amet, consetetur sadipscing elitr.</p>

<div id="cmpwrapper"><div id="cmpbox" class="fx-modal cmpbox">
  <div class="cmpboxtxt">Wir verwenden Cookies und andere Technologien auf unserer Website.</div>
  <a class="cmpboxbtn cmpboxbtnyes" role="button" href="#" data-cd="accepted" data-cd-hide="#cmpbox">Akzeptieren</a>
  <a class="cmpboxbtn cmpboxbtnno" role="button" href="#" data-cd="rejected" data-cd-hide="#cmpbox">Ablehnen</a>
  <a class="cmpboxbtn cmpboxbtncustom cmpmore" role="button" href="#" data-cd="settings">Einstellungen</a>
</div></div>
<script>
  (function () {
    var chosen = false;
    window.__cmp = function (cmd, arg) {
      if (cmd === "getCMPData") return { gdprApplies: true };
      if (cmd === "consentStatus") return { userChoiceExists: chosen };
      if (cmd === "setConsent") {
        chosen = true;
        CDT.report(arg === 0 ? "rejected" : "accepted", { api: true });
        document.getElementById("cmpbox").style.display = "none";
        return true;
      }
    };
  })();
</script>
</body>
</html>
